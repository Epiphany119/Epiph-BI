spring:
  application:
    name: epiph-bi-backend
  # 默认使用 local profile；application-local.yml 仅在 local profile 激活时自动加载
  profiles:
    active: local
  # 支持 swagger3
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  # session 配置
  session:
    # todo 取消注释开启分布式 session（须先配置 Redis）
    # store-type: redis
    # 30 天过期
    timeout: 2592000
  # 数据库配置
  # todo 需替换配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yubi}
    username: ${MYSQL_USERNAME:epiphany}
    password: ${MYSQL_PASSWORD}
  # Redis 配置
  # todo 需替换配置，然后取消注释
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
  # 文件上传
  servlet:
    multipart:
      # 与 analysis-biz 的文件限制保持一致，预留 multipart 边界开销。
      max-file-size: 5MB
      max-request-size: 6MB
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    password: ${RABBITMQ_PASSWORD}
    username: ${RABBITMQ_USERNAME}
server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /api
    # cookie 30 天过期
    session:
      cookie:
        max-age: 2592000
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
# 浏览器凭据请求仅允许明确配置的前端 Origin。
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:8000}

# WAITING 任务由定时恢复器按批补偿。
analysis:
  task:
    recovery-interval-ms: ${ANALYSIS_TASK_RECOVERY_INTERVAL_MS:30000}

# 微信相关
